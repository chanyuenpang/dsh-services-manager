# DSH >=0.2.2-rc.1 Desktop/Web bundle.
# Generic RPC registration still reads webServer in Connection's own fiber.
# Preserve the current template's webStartup (trustedHosts expression) and add
# webServer here, rather than editing the user's profile or injecting webRuntime.
- id: connection
  inject: [webStartup, webServer]
- insert:
    - id: dsh-services-manager
      name: dsh-services-manager
